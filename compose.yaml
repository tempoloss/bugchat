services:
  bugbot:
    build: .
    container_name: bugbot
    restart: unless-stopped
    env_file: .env
    environment:
      # состояние — в томе, чтобы пересборка образа не теряла привязки сообщение→задача
      BUGBOT_DB: /data/state.db
    volumes:
      - bugbot-state:/data
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  bugbot-state:
